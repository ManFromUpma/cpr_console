name: Publish EOD CPR site

on:
  schedule:
    # 16:45 IST Mon–Fri (11:15 UTC)
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (blank = last completed session)"
        required: false
        type: string
      site_only:
        description: "Rebuild site from committed CSVs only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eod-cpr-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Scan and build site
        env:
          SCAN_DATE: ${{ inputs.date }}
          SITE_ONLY: ${{ inputs.site_only }}
        run: |
          if [ "${SITE_ONLY}" = "true" ]; then
            python eod_publish.py --site-only
          elif [ -n "${SCAN_DATE}" ]; then
            python eod_publish.py "${SCAN_DATE}"
          else
            python eod_publish.py
          fi

      - name: Commit CSV archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpr_output
          if git diff --cached --quiet; then
            echo "No new CSVs"
          else
            git commit -m "EOD CPR scan $(date -u +%Y%m%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
